name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            wujiyu115/pricebot:latest
            wujiyu115/pricebot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          target: runtime
          load: true
          tags: wujiyu115/pricebot:test
          cache-from: type=gha

      - name: Smoke test image
        run: |
          docker run -d --name pricebot-test -p 16106:6106 \
            wujiyu115/pricebot:test
          sleep 12
          curl -fsS http://127.0.0.1:16106/api/dashboard | grep -q '"engine"'
          docker rm -f pricebot-test
